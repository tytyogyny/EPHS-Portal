const GRADE_SCALE = [
  { min: 80, grade: "A", remark: "Excellent" },
  { min: 60, grade: "B", remark: "Very Good" },
  { min: 50, grade: "C", remark: "Good" },
  { min: 45, grade: "D", remark: "Pass" },
  { min: 40, grade: "E", remark: "Fair" },
  { min: 0, grade: "F", remark: "Fail" },
];
function gradeFor(score) {
  if (score === undefined || score === null || isNaN(score)) return null;
  return GRADE_SCALE.find(g => score >= g.min);
}

// A subject score is either a legacy plain number, or {ca, exam}. This always
// returns a total number (or undefined if nothing has been entered yet).
function scoreTotal(v) {
  if (v === undefined || v === null) return undefined;
  if (typeof v === "number") return v;
  const ca = v.ca === undefined || v.ca === null ? undefined : Number(v.ca);
  const exam = v.exam === undefined || v.exam === null ? undefined : Number(v.exam);
  if (ca === undefined && exam === undefined) return undefined;
  return (ca || 0) + (exam || 0);
}
function scoreCA(v) {
  if (v === undefined || v === null || typeof v === "number") return undefined;
  return v.ca;
}
function scoreExam(v) {
  if (v === undefined || v === null) return undefined;
  if (typeof v === "number") return v;
  return v.exam;
}
// Counts weekdays (Mon-Fri) between two ISO date strings, inclusive.
function countWeekdays(startStr, endStr) {
  if (!startStr || !endStr) return null;
  const start = new Date(startStr);
  const end = new Date(endStr);
  if (isNaN(start) || isNaN(end) || end < start) return null;
  let count = 0;
  const d = new Date(start);
  while (d <= end) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}
function subjectsFor(data, className) {
  return (data.subjectsByClass && data.subjectsByClass[className] && data.subjectsByClass[className].length)
    ? data.subjectsByClass[className]
    : SUBJECTS_DEFAULT;
}

function reportError(context, err) {

  console.error(window.__portalLastError);

async function safeGet(key) {
  try {
    const { data, error } = await sb.from("portal_kv").select("value").eq("key", key).maybeSingle();
    if (error) { reportError(`Load failed (${key})`, error); return null; }
    if (!data) return null;
    return data.value;
  } catch (e) {
    reportError(`Load crashed (${key})`, e);
    return null;
  }
}
async function safeSet(key, value) {
  try {
    const { error } = await sb.from("portal_kv").upsert({ key, value });
    if (error) { reportError(`Save failed (${key})`, error); return false; }
    return true;
  } catch (e) {
    reportError(`Save crashed (${key})`, e);
    return false;
  }
}

function downloadFile(filename, content, mime = "text/plain;charset=utf-8") {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  const [role, setRole] = useState(initialRole || "student");
  const [id, setId] = useState("");
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  const roles = [
    { key: "student", label: "Student / Parent" },
    { key: "teacher", label: "Staff" },
    { key: "admin", label: "Admin" },
  ];

  function submit(e) {
    e.preventDefault();
    setError("");
    const idT = id.trim();
    const pinT = pin.trim();
    if (!idT || !pinT) { setError("Enter your ID and PIN."); return; }

    if (role === "admin") {
      // Master fallback: always works, regardless of whatever is stored in the database.
      // This exists so the school can never be permanently locked out of Admin.
      if (idT.toUpperCase() === "MASTERADMIN" && pinT === "EPHS-2026-RESET") {
        onLogin({ role: "admin", id: idT, name: "Administrator (Master Login)" });
        return;
      }
      if (idT.toLowerCase() === data.admin.adminId.toLowerCase() && pinT === data.admin.pin) {
        onLogin({ role: "admin", id: idT, name: "Administrator" });
        return;
      }
      setError("Incorrect Admin ID or PIN.");
      return;
    }
    if (role === "teacher") {
      const staff = data.staff.find(s => s.staffId.toLowerCase() === idT.toLowerCase() && s.pin === pinT);
      if (staff) { onLogin({ role: "teacher", id: staff.staffId, name: staff.name, classes: staff.classes }); return; }
      setError("Incorrect Staff ID or PIN.");
      return;
    }
    const guardian = data.guardians.find(g => g.guardianId.toLowerCase() === idT.toLowerCase() && g.pin === pinT);
    if (guardian) { onLogin({ role: "guardian", id: guardian.guardianId, name: guardian.name, studentIds: guardian.studentIds }); return; }
    const student = data.students.find(s => s.admissionId.toLowerCase() === idT.toLowerCase() && s.pin === pinT);
    if (student) { onLogin({ role: "student", id: student.admissionId, name: student.name, class: student.class, gender: student.gender, age: student.age }); return; }
    setError("Incorrect Admission ID / Parent ID or PIN.");
  }

  return (
    <div style={{ minHeight: "100vh", background: NAVY }} className="flex items-center justify-center px-4 py-10">
      <div className="w-full max-w-sm">
        <div className="flex flex-col items-center mb-6 text-white">
          <Crest size={64} />
          <div className="font-serif text-xl mt-3 text-center">Excellent Potter's Height School</div>
          <div className="text-xs uppercase tracking-widest mt-1" style={{ color: RED }}>Student &amp; Staff Portal</div>
        </div>
        {banner && (
          <div className="mb-4 p-3 rounded text-sm text-center" style={{ background: "white", color: NAVY, border: `1px solid ${LINE}` }}>
            {banner}
          </div>
        )}
        <Card>
          <div className="flex mb-4 rounded overflow-hidden" style={{ border: `1px solid ${LINE}` }}>
            {roles.map(r => (
              <button
                key={r.key}
                onClick={() => { setRole(r.key); setError(""); }}
                className="flex-1 py-2 text-xs font-semibold transition"
                style={role === r.key ? { background: NAVY, color: "white" } : { background: "white", color: NAVY }}
              >
                {r.label}
              </button>
            ))}
          </div>
          <form onSubmit={submit}>
            <Field label={role === "student" ? "Admission ID (or Parent ID)" : role === "teacher" ? "Staff ID" : "Admin ID"}>
              <input className={inputCls} style={inputStyle} value={id} onChange={e => setId(e.target.value)} autoComplete="off" />
            </Field>
            <Field label="PIN">
              <input type="password" className={inputCls} style={inputStyle} value={pin} onChange={e => setPin(e.target.value)} />
            </Field>
            {error && <div className="text-xs mb-3" style={{ color: RED }}>{error}</div>}
            <Button type="submit" onClick={submit}>Log in</Button>
          </form>
        </Card>
        <p className="text-center text-xs mt-4" style={{ color: "rgba(255,255,255,0.5)" }}>
          Default admin login: <span className="font-mono">ADMIN</span> / <span className="font-mono">0000</span> — change this after first login.
        </p>
      </div>
    </div>
  );
}

function CommentRow({ student, acadSession, term, data, setData, save }) {
  const key = `${student.admissionId}::${acadSession}::${term}`;
  const existing = data.comments[key] || { comment: "", signature: "" };
  const [comment, setComment] = useState(existing.comment);
  const [signature, setSignature] = useState(existing.signature);
  const [savedFlag, setSavedFlag] = useState(false);
  const [showPreview, setShowPreview] = useState(false);

  const resultEntry = data.results[key] || {};
  const rows = Object.entries(resultEntry).filter(([, v]) => scoreTotal(v) !== undefined);
  const scores = rows.map(([, v]) => scoreTotal(v));
  const avg = scores.length ? Math.round((scores.reduce((a, b) => a + b, 0) / scores.length) * 10) / 10 : null;

  async function saveNow() {
    const next = { ...data.comments, [key]: { comment, signature, date: new Date().toISOString().slice(0, 10) } };
    setData(d => ({ ...d, comments: next }));
    await save("portal:comments", next);
    setSavedFlag(true);
    setTimeout(() => setSavedFlag(false), 1500);
  }

  return (
    <div className="p-3 rounded" style={{ background: PAPER, border: `1px solid ${LINE}` }}>
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-semibold">{student.name}</div>
        <button type="button" onClick={() => setShowPreview(v => !v)} className="text-xs underline" style={{ color: NAVY }}>
          {showPreview ? "Hide" : "Preview"} Full Result{avg !== null ? ` (Avg ${avg}%)` : ""}
        </button>
      </div>
      {showPreview && (
        <div className="mb-3 p-2 rounded text-xs" style={{ background: "white", border: `1px solid ${LINE}` }}>
          {rows.length === 0 ? (
            <p style={{ color: "rgba(22,34,63,0.5)" }}>No scores entered yet for {term}.</p>
          ) : (
            rows.map(([subj, v]) => {
              const total = scoreTotal(v);
              return (
                <div key={subj} className="flex justify-between py-0.5">
                  <span>{subj}</span>
                  <span className="font-semibold" style={{ color: total >= 50 ? NAVY : RED }}>
                    {scoreCA(v) ?? "—"} + {scoreExam(v) ?? "—"} = {total}
                  </span>
                </div>
              );
            })
          )}
        </div>
      )}
      <textarea
        className="w-full text-sm px-3 py-2 rounded mb-2"
        style={{ ...inputStyle, background: "white" }}
        rows={2}
        placeholder="Comment for this term's report card…"
        value={comment}
        onChange={e => setComment(e.target.value)}
      />
      <div className="flex items-center gap-2">
        <input
          className="flex-1 text-sm px-3 py-1.5 rounded"
          style={{ ...inputStyle, background: "white" }}
          placeholder="Signed (e.g. your name / title)"
          value={signature}
          onChange={e => setSignature(e.target.value)}
        />
        <Button onClick={saveNow}>{savedFlag ? "Saved ✓" : "Save"}</Button>
      </div>
    </div>
  );
}

function TermInfoRow({ activeClass, acadSession, term, data, setData, save }) {
  const key = `${activeClass}::${acadSession}::${term}`;

  const [schoolOpened, setSchoolOpened] = useState(existing.schoolOpened);
  const [nextTermBegins, setNextTermBegins] = useState(existing.nextTermBegins);
  const [savedFlag, setSavedFlag] = useState(false);

  useEffect(() => {
    const e = data.termInfo[key] || { schoolOpened: "", nextTermBegins: "" };
    setSchoolOpened(e.schoolOpened);
    setNextTermBegins(e.nextTermBegins);
    // eslint-disable-next-line
  }, [key]);

  async function saveNow() {
    const next = { ...data.termInfo, [key]: { schoolOpened, nextTermBegins } };
    setData(d => ({ ...d, termInfo: next }));
    await save("portal:termInfo", next);
    setSavedFlag(true);
    setTimeout(() => setSavedFlag(false), 1500);
  }

  const termDateKey = `${acadSession}::${term}`;
  const termDateEntry = data.termDates[termDateKey];

  return (
    <div className="mt-4 p-3 rounded" style={{ background: PAPER, border: `1px solid ${LINE}` }}>

            value={schoolOpened} onChange={e => setSchoolOpened(e.target.value)} />

        <Field label="Next Term Begins">
          <input type="date" className="text-sm px-2 py-1.5 rounded" style={{ ...inputStyle, background: "white" }}
            value={nextTermBegins} onChange={e => setNextTermBegins(e.target.value)} />
        </Field>
        <Button onClick={saveNow}>{savedFlag ? "Saved ✓" : "Save"}</Button>
      </div>
      {calculatedDays !== null && (
        <p className="text-xs mt-2" style={{ color: NAVY }}>
          Term Dates say this term has ≈ {calculatedDays} school days.
          <button type="button" onClick={() => setSchoolOpened(String(calculatedDays))} className="underline ml-1">Use this number</button>
        </p>
      )}
      <p className="text-xs mt-2" style={{ color: "rgba(22,34,63,0.5)" }}>These appear on every student's report card for this class, session, and term.</p>
    </div>
  );
}

function AdminOverviewPanel({ data, setData, save }) {
  const [activeClass, setActiveClass] = useState(data.classes[0] || "");
  const [subTab, setSubTab] = useState("attendance");
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [acadSession, setAcadSession] = useState(data.sessions[0] || "");
  const [term, setTerm] = useState(TERMS[0]);
  const subjectList = subjectsFor(data, activeClass);
  const [subject, setSubject] = useState(subjectList[0]);

  useEffect(() => {
    const list = subjectsFor(data, activeClass);
    if (!list.includes(subject)) setSubject(list[0]);
    // eslint-disable-next-line
  }, [activeClass]);

  const classStudents = data.students.filter(s => s.class === activeClass);
  const attKey = `${activeClass}::${date}`;
  const attRecord = data.attendance[attKey] || {};

  let present = 0, absent = 0, unmarked = 0;
  classStudents.forEach(s => {
    const st = attRecord[s.admissionId];
    if (st === "present") present++;
    else if (st === "absent") absent++;
    else unmarked++;
  });

  async function setCA(admissionId, val) {
    const key = `${admissionId}::${acadSession}::${term}`;
    const existing = data.results[key] || {};
    const prev = existing[subject];
    const prevObj = typeof prev === "number" ? { ca: undefined, exam: prev } : (prev || {});
    const nextEntry = { ...existing, [subject]: { ...prevObj, ca: val === "" ? undefined : Number(val) } };
    const next = { ...data.results, [key]: nextEntry };
    setData(d => ({ ...d, results: next }));
    await save("portal:results", next);
  }
  async function setExam(admissionId, val) {
    const key = `${admissionId}::${acadSession}::${term}`;
    const existing = data.results[key] || {};
    const prev = existing[subject];
    const prevObj = typeof prev === "number" ? { ca: undefined, exam: undefined } : (prev || {});
    const nextEntry = { ...existing, [subject]: { ...prevObj, exam: val === "" ? undefined : Number(val) } };
    const next = { ...data.results, [key]: nextEntry };
    setData(d => ({ ...d, results: next }));
    await save("portal:results", next);
  }

  return (
    <Card>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <h3 className="font-serif text-lg mr-auto" style={{ color: NAVY }}>Class Overview <span className="text-xs font-sans font-normal" style={{ color: "rgba(22,34,63,0.5)" }}>(attendance view-only · results editable)</span></h3>
        <select className="text-xs px-2 py-1 rounded" style={inputStyle} value={activeClass} onChange={e => setActiveClass(e.target.value)}>
          {data.classes.map(c => <option key={c}>{c}</option>)}
        </select>
        <div className="flex gap-1">
          {["attendance", "results"].map(t => (
            <button key={t} onClick={() => setSubTab(t)}
              className="px-3 py-1.5 text-xs font-semibold rounded capitalize"
              style={subTab === t ? { background: NAVY, color: "white" } : { background: "white", color: NAVY, border: `1px solid ${LINE}` }}>
              {t}
            </button>
          ))}
        </div>
      </div>

      {classStudents.length === 0 && <p className="text-sm" style={{ color: "rgba(22,34,63,0.5)" }}>No students in this class yet.</p>}

      {subTab === "attendance" && classStudents.length > 0 && (
        <>
          <div className="flex items-center flex-wrap gap-3 mb-3">
            <input type="date" className="text-xs px-2 py-1 rounded" style={inputStyle} value={date} onChange={e => setDate(e.target.value)} />
            <span className="text-xs" style={{ color: "rgba(22,34,63,0.55)" }}>
              {present} present · {absent} absent · {unmarked} not yet marked
            </span>
          </div>
          <div className="space-y-1">
            {classStudents.map(s => {
              const st = attRecord[s.admissionId];
              return (
                <div key={s.admissionId} className="flex items-center justify-between py-2 border-b text-sm" style={{ borderColor: LINE }}>
                  <span>{s.name}</span>
                  <span className="text-xs px-2 py-0.5 rounded font-semibold"
                    style={st === "present" ? { background: "rgba(22,34,63,0.08)", color: NAVY }
                      : st === "absent" ? { background: "rgba(194,32,48,0.1)", color: RED }
                      : { background: PAPER, color: "rgba(22,34,63,0.4)", border: `1px solid ${LINE}` }}>
                    {st === "present" ? "Present" : st === "absent" ? "Absent" : "Not marked"}
                  </span>
                </div>
              );
            })}
          </div>
        </>
      )}

      {subTab === "results" && classStudents.length > 0 && (
        <>
          <div className="flex items-center flex-wrap gap-2 mb-3">
            <select className="text-xs px-2 py-1 rounded" style={inputStyle} value={acadSession} onChange={e => setAcadSession(e.target.value)}>
              {data.sessions.map(sess => <option key={sess}>{sess}</option>)}
            </select>
            <select className="text-xs px-2 py-1 rounded" style={inputStyle} value={term} onChange={e => setTerm(e.target.value)}>
              {TERMS.map(t => <option key={t}>{t}</option>)}
            </select>
            <select className="text-xs px-2 py-1 rounded" style={inputStyle} value={subject} onChange={e => setSubject(e.target.value)}>
              {subjectList.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
          <div className="space-y-1">
            <div className="flex justify-between py-1.5 text-xs font-semibold uppercase tracking-wide" style={{ color: "rgba(22,34,63,0.5)" }}>
              <span>Student</span>
              <span className="flex gap-2"><span className="w-16 text-center">C/A</span><span className="w-16 text-center">Exam</span><span className="w-16 text-center">Total</span></span>
            </div>
            {classStudents.map(s => {
              const entry = data.results[`${s.admissionId}::${acadSession}::${term}`] || {};
              const v = entry[subject];
              const ca = scoreCA(v);
              const exam = scoreExam(v);
              const total = scoreTotal(v);
              return (
                <div key={s.admissionId} className="flex items-center justify-between py-2 border-b text-sm" style={{ borderColor: LINE }}>
                  <span>{s.name}</span>
                  <span className="flex gap-2">
                    <input type="number" min="0" max="40" placeholder="C/A"
                      defaultValue={ca ?? ""}
                      onBlur={e => setCA(s.admissionId, e.target.value)}
                      className="w-16 text-sm px-2 py-1 rounded text-right" style={inputStyle} />
                    <input type="number" min="0" max="60" placeholder="Exam"
                      defaultValue={exam ?? ""}
                      onBlur={e => setExam(s.admissionId, e.target.value)}
                      className="w-16 text-sm px-2 py-1 rounded text-right" style={inputStyle} />
                    <span className="w-16 text-right font-semibold px-2 py-1" style={{ color: total === undefined ? "rgba(22,34,63,0.4)" : total >= 50 ? NAVY : RED }}>
                      {total === undefined ? "—" : total}
                    </span>
                  </span>
                </div>
              );
            })}
          </div>
          <p className="text-xs mt-3" style={{ color: "rgba(22,34,63,0.5)" }}>Correcting a score here overwrites what the teacher entered — changes save automatically when you click away from each box.</p>


          <TermInfoRow activeClass={activeClass} acadSession={acadSession} term={term} data={data} setData={setData} save={save} />

          <div className="mt-6 pt-4" style={{ borderTop: `1px solid ${LINE}` }}>
            <h4 className="font-serif text-base mb-1" style={{ color: NAVY }}>Head Teacher's Remarks — {acadSession}, {term}</h4>
            <p className="text-xs mb-3" style={{ color: "rgba(22,34,63,0.5)" }}>
              Appears on the student's report card for {acadSession}, {term}.
            </p>
            <div className="space-y-3">
              {classStudents.map(s => (
                <CommentRow key={s.admissionId} student={s} acadSession={acadSession} term={term} data={data} setData={setData} save={save} />
              ))}
            </div>
          </div>
        </>
      )}
    </Card>
  );
}

function StudentsPanel({ data, setData, save }) {
  const [form, setForm] = useState({ admissionId: "", pin: "", name: "", gender: "Female", age: "", class: data.classes[0] || "" });
  const [editing, setEditing] = useState(null);
  const [msg, setMsg] = useState("");

  async function addStudent(e) {
    e.preventDefault();
    if (!form.admissionId || !form.pin || !form.name) { setMsg("Fill in all fields."); return; }
    if (!editing && data.students.some(s => s.admissionId.toLowerCase() === form.admissionId.toLowerCase())) {
      setMsg("That Admission ID already exists."); return;
    }
    let next;
    if (editing) {
      next = data.students.map(s => s.admissionId === editing ? { ...form } : s);
    } else {
      next = [...data.students, { ...form }];
    }
    setData(d => ({ ...d, students: next }));
    await save("portal:students", next);
    setForm({ admissionId: "", pin: "", name: "", gender: "Female", age: "", class: data.classes[0] || "" });
    setEditing(null);
    setMsg("Saved.");
  }

  async function removeStudent(id) {
    const next = data.students.filter(s => s.admissionId !== id);
    setData(d => ({ ...d, students: next }));
    await save("portal:students", next);
  }

  function editStudent(s) {
    setForm(s);
    setEditing(s.admissionId);
  }

  return (

function TermDateRow({ term, acadSession, data, setData, save }) {
  const key = `${acadSession}::${term}`;
  const existing = data.termDates[key] || { resumption: "", vacation: "" };
  const [resumption, setResumption] = useState(existing.resumption);
  const [vacation, setVacation] = useState(existing.vacation);
  const [savedFlag, setSavedFlag] = useState(false);

  useEffect(() => {
    const e = data.termDates[key] || { resumption: "", vacation: "" };
    setResumption(e.resumption);
    setVacation(e.vacation);
    // eslint-disable-next-line
  }, [key]);

  const days = countWeekdays(resumption, vacation);

  async function saveNow() {
    const next = { ...data.termDates, [key]: { resumption, vacation } };
    setData(d => ({ ...d, termDates: next }));
    await save("portal:termDates", next);
    setSavedFlag(true);
    setTimeout(() => setSavedFlag(false), 1500);
  }

  return (
    <div className="p-3 rounded" style={{ background: PAPER, border: `1px solid ${LINE}` }}>
      <div className="text-sm font-semibold mb-2" style={{ color: NAVY }}>{term}</div>
      <div className="flex flex-wrap gap-3 items-end">
        <Field label="Resumption Date">
          <input type="date" className="text-sm px-2 py-1.5 rounded" style={{ ...inputStyle, background: "white" }} value={resumption} onChange={e => setResumption(e.target.value)} />
        </Field>
        <Field label="Vacation Date">
          <input type="date" className="text-sm px-2 py-1.5 rounded" style={{ ...inputStyle, background: "white" }} value={vacation} onChange={e => setVacation(e.target.value)} />
        </Field>
        <Button onClick={saveNow}>{savedFlag ? "Saved ✓" : "Save"}</Button>
      </div>
      {days !== null && (
        <p className="text-xs mt-2" style={{ color: NAVY }}>≈ {days} school days (weekdays) this term.</p>
      )}
    </div>
  );
}

function AdmissionLettersPanel({ data, setData, save }) {
  const [studentId, setStudentId] = useState(data.students[0] && data.students[0].admissionId || "");
  const [fileInfo, setFileInfo] = useState(null);
  const [msg, setMsg] = useState("");

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      setMsg("File is larger than 2MB — please use a smaller PDF or image.");
      return;
    }
    setMsg("");
    const reader = new FileReader();
    reader.onload = () => setFileInfo({ fileName: file.name, dataUrl: reader.result });
    reader.readAsDataURL(file);
  }

  async function saveLetter(e) {
    e.preventDefault();
    if (!studentId || !fileInfo) { setMsg("Choose a student and a file first."); return; }
    const next = { ...data.admissionLetters, [studentId]: { ...fileInfo, uploadedDate: new Date().toISOString().slice(0, 10) } };
    setData(d => ({ ...d, admissionLetters: next }));
    await save("portal:admissionLetters", next);
    setFileInfo(null);
    setMsg("Saved — the student/parent can now see it under their Admission Letter tab.");
  }

  async function removeLetter(id) {
    const next = { ...data.admissionLetters };
    delete next[id];
    setData(d => ({ ...d, admissionLetters: next }));
    await save("portal:admissionLetters", next);
  }

  const withLetters = data.students.filter(s => data.admissionLetters[s.admissionId]);

  return (
    <div className="grid gap-4 sm:grid-cols-2">
      <Card>
        <h3 className="font-serif text-lg mb-3" style={{ color: NAVY }}>Upload Admission Letter</h3>
        <form onSubmit={saveLetter}>
          <Field label="Student">
            <select className={inputCls} style={inputStyle} value={studentId} onChange={e => setStudentId(e.target.value)}>
              {data.students.map(s => <option key={s.admissionId} value={s.admissionId}>{s.name} ({s.admissionId})</option>)}
            </select>
          </Field>
          <Field label="Letter File (PDF or image, max 2MB)">
            <input type="file" accept="application/pdf,image/*" onChange={handleFile} className="w-full text-sm" />
          </Field>
          {fileInfo && <div className="text-xs mb-3" style={{ color: NAVY }}>Ready to save: {fileInfo.fileName}</div>}
          {msg && <div className="text-xs mb-3" style={{ color: RED }}>{msg}</div>}
          <Button type="submit" onClick={saveLetter}>Save Letter</Button>
        </form>
        <p className="text-xs mt-3" style={{ color: "rgba(22,34,63,0.5)" }}>
          Keep files small (under 2MB) — large files slow the portal down for everyone.
        </p>
      </Card>
      <Card>
        <h3 className="font-serif text-lg mb-3" style={{ color: NAVY }}>Letters on File ({withLetters.length})</h3>
        {withLetters.length === 0 && <p className="text-sm" style={{ color: "rgba(22,34,63,0.5)" }}>No admission letters uploaded yet.</p>}
        <div className="max-h-96 overflow-y-auto">
          {withLetters.map(s => {
            const l = data.admissionLetters[s.admissionId];
            return (
              <div key={s.admissionId} className="flex items-center justify-between py-2 border-b text-sm" style={{ borderColor: LINE }}>
                <div>
                  <div className="font-semibold">{s.name}</div>
                  <div className="text-xs" style={{ color: "rgba(22,34,63,0.55)" }}>{l.fileName} · {l.uploadedDate}</div>
                </div>
                <button onClick={() => removeLetter(s.admissionId)} className="text-xs underline" style={{ color: RED }}>Remove</button>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

function FeesPanel({ data, setData, save, isAdmin, lockedStudentId }) {
  const [studentId, setStudentId] = useState(lockedStudentId || (data.students[0] && data.students[0].admissionId) || "");
  const [amount, setAmount] = useState("");
  const [type, setType] = useState("payment");
  const [note, setNote] = useState("");
  const record = data.fees[studentId] || { balance: 0, history: [] };
  const student = data.students.find(s => s.admissionId === studentId);

  async function addEntry(e) {
    e.preventDefault();
    const amt = parseFloat(amount);
    if (!studentId || isNaN(amt)) return;
    const delta = type === "payment" ? -amt : amt;
    const newRecord = {
      balance: (record.balance || 0) + delta,
      history: [{ date: new Date().toISOString().slice(0, 10), amount: amt, type, note }, ...(record.history || [])],
    };
    const next = { ...data.fees, [studentId]: newRecord };
    setData(d => ({ ...d, fees: next }));
    await save("portal:fees", next);
    setAmount(""); setNote("");
  }

  return (
    <div className="grid gap-4 sm:grid-cols-2">
      {isAdmin && (
        <Card>
          <h3 className="font-serif text-lg mb-3" style={{ color: NAVY }}>Add Fee Entry</h3>
          <form onSubmit={addEntry}>
            <Field label="Student">
              <select className={inputCls} style={inputStyle} value={studentId} onChange={e => setStudentId(e.target.value)}>
                {data.students.map(s => <option key={s.admissionId} value={s.admissionId}>{s.name} ({s.admissionId})</option>)}
              </select>
            </Field>
            <Field label="Type">
              <select className={inputCls} style={inputStyle} value={type} onChange={e => setType(e.target.value)}>
                <option value="charge">Charge (fee billed)</option>
                <option value="payment">Payment received</option>
              </select>
            </Field>
            <Field label="Amount (₦)"><input type="number" className={inputCls} style={inputStyle} value={amount} onChange={e => setAmount(e.target.value)} /></Field>
            <Field label="Note (optional)"><input className={inputCls} style={inputStyle} value={note} onChange={e => setNote(e.target.value)} /></Field>
            <Button type="submit" onClick={addEntry}>Save Entry</Button>
          </form>
          <p className="text-xs mt-3" style={{ color: "rgba(22,34,63,0.5)" }}>
            Note: this records fee balances only — it does not process real payments. Connect a payment gateway (e.g. Paystack) separately for online payment collection.
          </p>
        </Card>
      )}
      <Card>
        <h3 className="font-serif text-lg mb-3" style={{ color: NAVY }}>
          {student ? `${student.name}'s Fee Record` : "Fee Record"}
        </h3>
        <div className="mb-4 p-3 rounded" style={{ background: record.balance > 0 ? "rgba(194,32,48,0.08)" : "rgba(22,34,63,0.05)" }}>
          <div className="text-xs uppercase tracking-wide" style={{ color: "rgba(22,34,63,0.6)" }}>Current Balance</div>
          <div className="text-2xl font-serif" style={{ color: record.balance > 0 ? RED : NAVY }}>
            ₦{(record.balance || 0).toLocaleString()}
          </div>
          <div className="text-xs mt-1" style={{ color: "rgba(22,34,63,0.5)" }}>
            {record.balance > 0 ? "Amount owed to the school" : "No outstanding balance"}
          </div>
        </div>
        <div className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: "rgba(22,34,63,0.6)" }}>History</div>
        <div className="max-h-64 overflow-y-auto">
          {(record.history || []).length === 0 && <p className="text-sm" style={{ color: "rgba(22,34,63,0.5)" }}>No fee records yet.</p>}
          {(record.history || []).map((h, i) => (
            <div key={i} className="flex justify-between py-1.5 border-b text-sm" style={{ borderColor: LINE }}>
              <div>
                <div>{h.type === "payment" ? "Payment" : "Charge"}{h.note ? ` — ${h.note}` : ""}</div>
                <div className="text-xs" style={{ color: "rgba(22,34,63,0.5)" }}>{h.date}</div>
              </div>
              <div className="font-semibold" style={{ color: h.type === "payment" ? NAVY : RED }}>
                {h.type === "payment" ? "-" : "+"}₦{h.amount.toLocaleString()}
              </div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

function ResultsPanel({ data, setData, save, activeClass }) {
  const [acadSession, setAcadSession] = useState(data.sessions[0] || "");
  const [term, setTerm] = useState(TERMS[0]);
  const subjectList = subjectsFor(data, activeClass);
  const [subject, setSubject] = useState(subjectList[0]);
  const [newSubject, setNewSubject] = useState("");
  const [subjMsg, setSubjMsg] = useState("");
  const classStudents = data.students.filter(s => s.class === activeClass);

  useEffect(() => {
    const list = subjectsFor(data, activeClass);
    if (!list.includes(subject)) setSubject(list[0]);
    // eslint-disable-next-line
  }, [activeClass]);

  async function setCA(admissionId, val) {
    const key = `${admissionId}::${acadSession}::${term}`;
    const existing = data.results[key] || {};
    const prev = existing[subject];
    const prevObj = typeof prev === "number" ? { ca: undefined, exam: prev } : (prev || {});
    const nextEntry = { ...existing, [subject]: { ...prevObj, ca: val === "" ? undefined : Number(val) } };
    const next = { ...data.results, [key]: nextEntry };
    setData(d => ({ ...d, results: next }));
    await save("portal:results", next);
  }
  async function setExam(admissionId, val) {
    const key = `${admissionId}::${acadSession}::${term}`;
    const existing = data.results[key] || {};
    const prev = existing[subject];
    const prevObj = typeof prev === "number" ? { ca: undefined, exam: undefined } : (prev || {});
    const nextEntry = { ...existing, [subject]: { ...prevObj, exam: val === "" ? undefined : Number(val) } };
    const next = { ...data.results, [key]: nextEntry };
    setData(d => ({ ...d, results: next }));
    await save("portal:results", next);
  }

  async function addSubject(e) {
    e.preventDefault();
    const name = newSubject.trim();
    if (!name) return;
    const list = subjectsFor(data, activeClass);
    if (list.includes(name)) { setSubjMsg("That subject is already in the list."); return; }
    const nextList = [...list, name];
    const next = { ...data.subjectsByClass, [activeClass]: nextList };
    setData(d => ({ ...d, subjectsByClass: next }));
    await save("portal:subjectsByClass", next);
    setNewSubject("");
    setSubjMsg("");
    setSubject(name);
  }
  async function renameSubject(oldName) {
    const newName = window.prompt(`Rename "${oldName}" to:`, oldName);
    if (!newName || !newName.trim() || newName.trim() === oldName) return;
    const list = subjectsFor(data, activeClass).map(s => s === oldName ? newName.trim() : s);
    const next = { ...data.subjectsByClass, [activeClass]: list };
    setData(d => ({ ...d, subjectsByClass: next }));
    await save("portal:subjectsByClass", next);
    if (subject === oldName) setSubject(newName.trim());
  }
  async function removeSubject(name) {
    if (!window.confirm(`Remove "${name}" from this class's subject list? Already-entered scores for it are kept, just hidden from future entry.`)) return;
    const list = subjectsFor(data, activeClass).filter(s => s !== name);
    const next = { ...data.subjectsByClass, [activeClass]: list.length ? list : SUBJECTS_DEFAULT };
    setData(d => ({ ...d, subjectsByClass: next }));
    await save("portal:subjectsByClass", next);
  }

  return (
    <Card>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <h3 className="font-serif text-lg mr-auto" style={{ color: NAVY }}>Results — {activeClass}</h3>
        <select className="text-xs px-2 py-1 rounded" style={inputStyle} value={acadSession} onChange={e => setAcadSession(e.target.value)}>
          {data.sessions.map(sess => <option key={sess}>{sess}</option>)}
        </select>
        <select className="text-xs px-2 py-1 rounded" style={inputStyle} value={term} onChange={e => setTerm(e.target.value)}>
          {TERMS.map(t => <option key={t}>{t}</option>)}
        </select>
        <select className="text-xs px-2 py-1 rounded" style={inputStyle} value={subject} onChange={e => setSubject(e.target.value)}>
          {subjectList.map(s => <option key={s}>{s}</option>)}
        </select>
      </div>

      <div className="mb-4 p-3 rounded flex flex-wrap items-center gap-2" style={{ background: PAPER, border: `1px solid ${LINE}` }}>
        <form onSubmit={addSubject} className="flex gap-2 items-center">
          <input className="text-xs px-2 py-1.5 rounded" style={inputStyle} placeholder="Add subject for this class" value={newSubject} onChange={e => setNewSubject(e.target.value)} />
          <Button type="submit" onClick={addSubject}>Add Subject</Button>
        </form>
        <button type="button" onClick={() => renameSubject(subject)} className="text-xs underline ml-auto" style={{ color: NAVY }}>Rename "{subject}"</button>
        <button type="button" onClick={() => removeSubject(subject)} className="text-xs underline" style={{ color: RED }}>Remove "{subject}"</button>
      </div>
      {subjMsg && <div className="text-xs mb-3" style={{ color: RED }}>{subjMsg}</div>}

      {classStudents.length === 0 && <p className="text-sm" style={{ color: "rgba(22,34,63,0.5)" }}>No students in this class yet.</p>}
      <div className="space-y-1">
        <div className="flex justify-between py-1.5 text-xs font-semibold uppercase tracking-wide" style={{ color: "rgba(22,34,63,0.5)" }}>
          <span>Student</span>
          <span className="flex gap-2"><span className="w-16 text-center">C/A</span><span className="w-16 text-center">Exam</span><span className="w-16 text-center">Total</span></span>
        </div>
        {classStudents.map(s => {
          const entry = data.results[`${s.admissionId}::${acadSession}::${term}`] || {};
          const v = entry[subject];
          const ca = scoreCA(v);
          const exam = scoreExam(v);
          const total = scoreTotal(v);
          return (
            <div key={s.admissionId} className="flex items-center justify-between py-2 border-b text-sm" style={{ borderColor: LINE }}>
              <span>{s.name}</span>
              <span className="flex gap-2">
                <input type="number" min="0" max="40" placeholder="C/A"
                  defaultValue={ca ?? ""}
                  onBlur={e => setCA(s.admissionId, e.target.value)}
                  className="w-16 text-sm px-2 py-1 rounded text-right" style={inputStyle} />
                <input type="number" min="0" max="60" placeholder="Exam"
                  defaultValue={exam ?? ""}
                  onBlur={e => setExam(s.admissionId, e.target.value)}
                  className="w-16 text-sm px-2 py-1 rounded text-right" style={inputStyle} />
                <span className="w-16 text-right font-semibold px-2 py-1" style={{ color: total === undefined ? "rgba(22,34,63,0.4)" : total >= 50 ? NAVY : RED }}>
                  {total === undefined ? "—" : total}
                </span>
              </span>
            </div>
          );
        })}
      </div>
      <p className="text-xs mt-3" style={{ color: "rgba(22,34,63,0.5)" }}>Enter C/A and Exam separately — Total updates automatically. Scores save when you click away from a box.</p>
    </Card>
  );
}

function ChildSummaryCard({ studentId, data, acadSession, term }) {
  const student = data.students.find(s => s.admissionId === studentId);
  if (!student) return null;

  const attendanceEntries = Object.entries(data.attendance).filter(([k]) => k.startsWith(`${student.class}::`));
  let present = 0, absent = 0;
  attendanceEntries.forEach(([, rec]) => {
    const st = rec[studentId];
    if (st === "present") present++;
    if (st === "absent") absent++;
  });
  const total = present + absent;
  const pct = total ? Math.round((present / total) * 100) : null;

  const resultEntry = data.results[`${studentId}::${acadSession}::${term}`] || {};
  const scores = Object.values(resultEntry).map(v => scoreTotal(v)).filter(v => v !== undefined);
  const avg = scores.length ? Math.round((scores.reduce((a, b) => a + b, 0) / scores.length) * 10) / 10 : null;
  const grade = avg !== null ? gradeFor(avg) : null;
  const feeRecord = data.fees[studentId] || { balance: 0 };
  const commentEntry = data.comments[`${studentId}::${acadSession}::${term}`];

  return (
    <Card style={{ marginBottom: 16 }}>
      <div className="flex items-center justify-between mb-3">
        <div>
          <div className="font-serif text-lg" style={{ color: NAVY }}>{student.name}</div>
          <div className="text-xs" style={{ color: "rgba(22,34,63,0.55)" }}>{student.class} · Admission ID: {student.admissionId}</div>
        </div>
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
        <div className="p-2 rounded text-center" style={{ background: PAPER }}>
          <div className="text-xs" style={{ color: "rgba(22,34,63,0.5)" }}>Attendance</div>
          <div className="font-semibold" style={{ color: NAVY }}>{pct === null ? "—" : `${pct}%`}</div>
        </div>
        <div className="p-2 rounded text-center" style={{ background: PAPER }}>
          <div className="text-xs" style={{ color: "rgba(22,34,63,0.5)" }}>Average</div>
          <div className="font-semibold" style={{ color: NAVY }}>{avg === null ? "—" : `${avg}%`}</div>
        </div>
        <div className="p-2 rounded text-center" style={{ background: PAPER }}>
          <div className="text-xs" style={{ color: "rgba(22,34,63,0.5)" }}>Grade</div>
          <div className="font-semibold" style={{ color: NAVY }}>{grade ? grade.grade : "—"}</div>
        </div>
        <div className="p-2 rounded text-center" style={{ background: feeRecord.balance > 0 ? "rgba(194,32,48,0.08)" : PAPER }}>
          <div className="text-xs" style={{ color: "rgba(22,34,63,0.5)" }}>Fee Balance</div>
          <div className="font-semibold" style={{ color: feeRecord.balance > 0 ? RED : NAVY }}>₦{(feeRecord.balance || 0).toLocaleString()}</div>
        </div>
      </div>
      {scores.length > 0 && (
        <div className="mb-3">
          <div className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: "rgba(22,34,63,0.5)" }}>Subject Scores — {term}</div>
          {Object.entries(resultEntry).filter(([, v]) => scoreTotal(v) !== undefined).map(([subj, v]) => (
            <div key={subj} className="flex justify-between py-1 text-sm border-b" style={{ borderColor: LINE }}>
              <span>{subj}</span>
              <span className="font-semibold" style={{ color: scoreTotal(v) >= 50 ? NAVY : RED }}>{scoreTotal(v)}/100</span>
            </div>
          ))}
        </div>
      )}
      {commentEntry && commentEntry.comment && (
        <div className="text-xs italic mt-2" style={{ color: NAVY }}>&ldquo;{commentEntry.comment}&rdquo; — {commentEntry.signature}</div>
      )}
    </Card>
  );
}

function GuardianDashboard({ session, data }) {
  const [acadSession, setAcadSession] = useState(data.sessions[0] || "");
  const [term, setTerm] = useState(TERMS[0]);

  function downloadChildrenResults() {
    const rows = [["Student", "Admission ID", "Class", "Session", "Term", "Subject", "Score", "Grade"]];
    session.studentIds.forEach(id => {
      const student = data.students.find(st => st.admissionId === id);
      if (!student) return;
      const result = data.results[`${id}::${acadSession}::${term}`] || {};
      Object.entries(result).forEach(([subject, value]) => {
        const score = scoreTotal(value);
        if (score === undefined) return;
        const grade = gradeFor(score);
        rows.push([student.name, student.admissionId, student.class, acadSession, term, subject, score, grade ? grade.grade : ""]);
      });
    });

function StudentDashboard({ session, data }) {
  const [tab, setTab] = useState("results");
  const [viewMode, setViewMode] = useState("single");
  const [acadSession, setAcadSession] = useState(data.sessions[0] || "");
  const [term, setTerm] = useState(TERMS[0]);

  const attendanceEntries = Object.entries(data.attendance).filter(([k]) => k.startsWith(`${session.class}::`));
  let present = 0, absent = 0;
  attendanceEntries.forEach(([, rec]) => {
    const st = rec[session.id];
    if (st === "present") present++;
    if (st === "absent") absent++;
  });
  const total = present + absent;
  const pct = total ? Math.round((present / total) * 100) : null;

  const resultEntry = data.results[`${session.id}::${acadSession}::${term}`] || {};
  const commentEntry = data.comments[`${session.id}::${acadSession}::${term}`];
  const feeRecord = data.fees[session.id] || { balance: 0, history: [] };

  // Compound (cumulative) result: all subjects seen across the session's 3 terms
  const termResults = TERMS.map(t => data.results[`${session.id}::${acadSession}::${t}`] || {});
  const allSubjects = Array.from(new Set(termResults.flatMap(r => Object.keys(r)))).filter(subj =>
    termResults.some(r => scoreTotal(r[subj]) !== undefined)
  );
  const termTotals = termResults.map(r => {
    const scores = Object.values(r).map(v => scoreTotal(v)).filter(v => v !== undefined);
    return scores.length ? Math.round((scores.reduce((a, b) => a + b, 0) / scores.length) * 10) / 10 : null;
  });
  const validTermAverages = termTotals.filter(v => v !== null);

  const currentTermTotal = currentScores.reduce((a, b) => a + b, 0);

  const currentTermPct = currentScores.length ? Math.round((currentTermTotal / currentTermMax) * 1000) / 10 : null;
  const subjectsGraded = currentScores.length;

  const allTermScores = termResults.flatMap(r => Object.values(r).map(v => scoreTotal(v)).filter(v => v !== undefined));
  const grandTotalAllTerms = allTermScores.reduce((a, b) => a + b, 0);

function ParentBonusPage({ data, setData, save }) {
  const [status, setStatus] = useState("enter"); // enter | checking | won | full | duplicate | notfound | error
  const [admissionId, setAdmissionId] = useState("");

  function resolveFamilyKey(idT) {
    // A parent may enter their own Parent ID, or any one of their children's Admission IDs —
    // either way, the claim is tracked against the whole family (via the Parent/Guardian ID),
    // so one family can't claim twice using different children.
    const guardian = data.guardians.find(g => g.guardianId.toLowerCase() === idT.toLowerCase());
    if (guardian) return { key: guardian.guardianId, label: guardian.name };

    const student = data.students.find(s => s.admissionId.toLowerCase() === idT.toLowerCase());
    if (!student) return null;

    const linkedGuardian = data.guardians.find(g => g.studentIds.some(sid => sid.toLowerCase() === idT.toLowerCase()));
    if (linkedGuardian) return { key: linkedGuardian.guardianId, label: linkedGuardian.name };
    return { key: student.admissionId, label: student.name };
  }

  async function claim(e) {
    if (e) e.preventDefault();
    const idT = admissionId.trim();
    if (!idT) return;
    setStatus("checking");
    try {
      const resolved = resolveFamilyKey(idT);
      if (!resolved) { setStatus("notfound"); return; }

      const fresh = await safeGet("portal:voucherScans");
      const current = fresh || { parentBonus: { count: 0, limit: 10, claimedIds: [] } };
      const pb = current.parentBonus || { count: 0, limit: 10, claimedIds: [] };
      const claimedIds = pb.claimedIds || [];

      if (claimedIds.some(x => x.toLowerCase() === resolved.key.toLowerCase())) {
        setStatus("duplicate");
        return;
      }
      if (pb.count >= pb.limit) {
        setStatus("full");
        return;
      }
      const next = { ...current, parentBonus: { ...pb, count: pb.count + 1, claimedIds: [...claimedIds, resolved.key] } };
      const ok = await safeSet("portal:voucherScans", next);
      if (!ok) { setStatus("error"); return; }
      setData(d => ({ ...d, voucherScans: next }));
      setStatus("won");
    } catch (err) {
      setStatus("error");
    }
  }

  if (status === "enter" || status === "checking") {
    return (
      <BonusShell>
        <h2 className="font-serif text-xl mb-2" style={{ color: NAVY }}>Claim Your Bonus</h2>
        <p className="text-sm mb-4" style={{ color: "rgba(22,34,63,0.6)" }}>Enter your Parent ID, or any one of your children's Admission IDs, to check if you qualify for this term's bonus.</p>
        <form onSubmit={claim}>
          <input
            className="w-full text-sm px-3 py-2 rounded mb-3 text-center"
            style={{ border: `1px solid ${LINE}`, background: PAPER }}
            placeholder="Parent ID or Admission ID"
            value={admissionId}
            onChange={e => setAdmissionId(e.target.value)}
            disabled={status === "checking"}
          />
          <Button type="submit" onClick={claim} disabled={status === "checking"}>
            {status === "checking" ? "Checking…" : "Check My Bonus"}
          </Button>
        </form>
      </BonusShell>
    );
  }
  if (status === "notfound") {
    return (
      <BonusShell>
        <p className="text-sm" style={{ color: RED }}>We couldn't find that Admission ID. Please check and try again, or contact the school office.</p>
        <div className="mt-4"><Button variant="ghost" onClick={() => setStatus("enter")}>Try Again</Button></div>
      </BonusShell>
    );
  }
  if (status === "duplicate") {
    return (
      <BonusShell>
        <div className="text-4xl mb-3">🙏</div>
        <h2 className="font-serif text-xl mb-2" style={{ color: NAVY }}>Already Claimed</h2>
        <p className="text-sm">This student's bonus has already been claimed this term.</p>
      </BonusShell>
    );
  }
  if (status === "full") {
    return (
      <BonusShell>
        <div className="text-4xl mb-3">🙏</div>
        <h2 className="font-serif text-xl mb-2" style={{ color: NAVY }}>Thank you!</h2>
        <p className="text-sm">This term's bonus quota has already been claimed by 10 parents.</p>
        <p className="text-xs mt-4" style={{ color: "rgba(22,34,63,0.55)" }}>Please check again next term.</p>
      </BonusShell>
    );
  }
  if (status === "error") {
    return (
      <BonusShell>
        <p className="text-sm" style={{ color: RED }}>Something went wrong. Please try again, or contact the school office.</p>
      </BonusShell>
    );
  }
  return (
    <BonusShell>
      <div className="text-4xl mb-3">🎉</div>
      <h2 className="font-serif text-xl mb-2" style={{ color: NAVY }}>Congratulations!</h2>

      <p className="text-base font-semibold" style={{ color: RED }}>You have earned ₦2000 credit for prompt payment.</p>
      <p className="text-xs mt-4" style={{ color: "rgba(22,34,63,0.55)" }}>Please see the school Admin office to claim this reward.</p>
    </BonusShell>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [session, setSession] = useState(null);
  const [data, setData] = useState(null);
  const [syncError, setSyncError] = useState(null);

  useEffect(() => {
    const interval = setInterval(() => {
      if (window.__portalLastError && window.__portalLastError !== syncError) {
        setSyncError(window.__portalLastError);
      }
    }, 1000);
    return () => clearInterval(interval);
  }, [syncError]);

  const save = useCallback(async (key, value) => { await safeSet(key, value); }, []);

  useEffect(() => {
    (async () => {
      let [students, staff, admin, classes, attendance, results, fees, comments, sessions, termInfo, admissionLetters, admissionInquiries, voucherScans, guardians, subjectsByClass, termDates] = await Promise.all([
        safeGet("portal:students"),
        safeGet("portal:staff"),
        safeGet("portal:admin"),
        safeGet("portal:classes"),
        safeGet("portal:attendance"),
        safeGet("portal:results"),
        safeGet("portal:fees"),
        safeGet("portal:comments"),
        safeGet("portal:sessions"),
        safeGet("portal:termInfo"),
        safeGet("portal:admissionLetters"),
        safeGet("portal:admissionInquiries"),
        safeGet("portal:voucherScans"),
        safeGet("portal:guardians"),
        safeGet("portal:subjectsByClass"),
        safeGet("portal:termDates"),
      ]);
      if (!students) { students = []; await safeSet("portal:students", students); }
      if (!staff) { staff = []; await safeSet("portal:staff", staff); }
      if (!admin) { admin = { adminId: "ADMIN", pin: "0000" }; await safeSet("portal:admin", admin); }
      if (!classes) { classes = DEFAULT_CLASSES; await safeSet("portal:classes", classes); }
      if (!attendance) { attendance = {}; await safeSet("portal:attendance", attendance); }
      if (!results) { results = {}; await safeSet("portal:results", results); }
      if (!fees) { fees = {}; await safeSet("portal:fees", fees); }
      if (!comments) { comments = {}; await safeSet("portal:comments", comments); }
      if (!sessions) { sessions = SESSIONS_DEFAULT; await safeSet("portal:sessions", sessions); }
      if (!termInfo) { termInfo = {}; await safeSet("portal:termInfo", termInfo); }
      if (!admissionLetters) { admissionLetters = {}; await safeSet("portal:admissionLetters", admissionLetters); }
      if (!admissionInquiries) { admissionInquiries = []; await safeSet("portal:admissionInquiries", admissionInquiries); }
      if (!voucherScans) { voucherScans = { parentBonus: { count: 0, limit: 10, claimedIds: [] } }; await safeSet("portal:voucherScans", voucherScans); }
      if (!guardians) { guardians = []; await safeSet("portal:guardians", guardians); }
      if (!subjectsByClass) { subjectsByClass = {}; await safeSet("portal:subjectsByClass", subjectsByClass); }
      if (!termDates) { termDates = {}; await safeSet("portal:termDates", termDates); }
      setData({ students, staff, admin, classes, attendance, results, fees, comments, sessions, termInfo, admissionLetters, admissionInquiries, voucherScans, guardians, subjectsByClass, termDates });
      setLoading(false);
    })();
  }, []);

  function handleLogout() {
    setSession(null);
  }

  if (loading || !data) return <Spinner />;

  const urlParams = new URLSearchParams(window.location.search);
  const bonusParam = urlParams.get("bonus");
  if (bonusParam === "parent") {
    return <><PrintStyles /><ParentBonusPage data={data} setData={setData} save={save} /></>;
  }

  const dataWithLogout = { ...data, onLogout: handleLogout };

  if (!session) {
    return <><PrintStyles /><SyncErrorBanner message={syncError} onClear={() => setSyncError(null)} />
      {<Login onLogin={setSession} data={data}
        initialRole={bonusParam === "staff" ? "teacher" : undefined}
        banner={bonusParam === "staff" ? "Log in with your Staff ID to claim your bonus." : null}
      />}
    </>;
  }

  let content;
  if (session.role === "admin") content = <AdminDashboard data={dataWithLogout} setData={setData} save={save} />;
  else if (session.role === "teacher") content = <TeacherDashboard session={session} data={dataWithLogout} setData={setData} save={save} startOnBonus={bonusParam === "staff"} />;
  else if (session.role === "guardian") content = <GuardianDashboard session={session} data={dataWithLogout} />;
  else content = <StudentDashboard session={session} data={dataWithLogout} />;

  return <><PrintStyles /><SyncErrorBanner message={syncError} onClear={() => setSyncError(null)} />{content}</>;
}

function SyncErrorBanner({ message, onClear }) {
  if (!message) return null;
  return (
    <div style={{
      position: "fixed", top: 0, left: 0, right: 0, zIndex: 999,
      background: "#c22030", color: "white", padding: "10px 16px",
      fontSize: "13px", display: "flex", alignItems: "center", gap: "12px",
    }}>
      <span style={{ flex: 1 }}><strong>Sync problem:</strong> {message}</span>
      <button onClick={onClear} style={{ background: "rgba(255,255,255,0.2)", border: "none", color: "white", padding: "4px 10px", borderRadius: "4px", fontSize: "12px" }}>Dismiss</button>
    </div>
  );
}

function PrintStyles() {
  return (
    <style>{`
      .print-header-flex, .print-header-grid { display: none; }
      @media print {
        body * { visibility: hidden; }
        #report-card-print, #report-card-print * { visibility: visible; }
        #report-card-print { position: absolute; left: 0; top: 0; width: 100%; padding: 24px; }
        .no-print { display: none !important; }
        .print-header-flex { display: flex !important; }
        .print-header-grid { display: grid !important; }
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

</script>
</body>
</html>
